
name: Terraform Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-aws-dev
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  AWS_REGION: ${{ vars.AWS_REGION }}
  TF_VAR_domain_name: "932431569521.realhandsonlabs.net"
  TF_VAR_allow_http_only: "false"

jobs:
  init:
    name: Terraform Init
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: environments/dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check required configuration
        run: |
          if [[ -z "$AWS_REGION" ]]; then
            echo "::error::Set the AWS_REGION repository variable."
            exit 1
          fi

          if [[ "$AWS_REGION" != "us-east-1" ]]; then
            echo "::error::AWS_REGION must be us-east-1."
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Initialize Terraform
        run: terraform init -input=false

  validate:
    name: Terraform Validate
    needs: init
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: environments/dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Initialize Terraform
        run: terraform init -input=false

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Validate Terraform
        run: terraform validate

  plan:
    name: Terraform Plan
    needs: validate
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: environments/dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Find public Route 53 hosted zone
        run: |
          ZONE_ID=$(aws route53 list-hosted-zones-by-name \
            --dns-name 932431569521.realhandsonlabs.net \
            --query "HostedZones[?Name=='932431569521.realhandsonlabs.net.' && Config.PrivateZone==\`false\`].Id | [0]" \
            --output text)

          if [[ -z "$ZONE_ID" || "$ZONE_ID" == "None" ]]; then
            echo "::error::Public hosted zone 932431569521.realhandsonlabs.net was not found."
            exit 1
          fi

          ZONE_ID="${ZONE_ID##*/}"
          echo "Public hosted zone found."
          echo "TF_VAR_hosted_zone_id=$ZONE_ID" >> "$GITHUB_ENV"

      - name: Initialize Terraform
        run: terraform init -input=false

      - name: Check database secret
        env:
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
        run: |
          if [[ -z "$TF_VAR_db_password" ]]; then
            echo "::error::Add the TF_VAR_DB_PASSWORD repository secret."
            exit 1
          fi

      - name: Create Terraform plan
        env:
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
        run: |
          terraform plan \
            -input=false \
            -lock-timeout=60s \
            -out=tfplan

      - name: Upload Terraform plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: environments/dev/tfplan
          retention-days: 1
          if-no-files-found: error

  apply:
    name: Terraform Apply
    needs: plan
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: environments/dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Download Terraform plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: environments/dev

      - name: Check saved plan
        run: |
          if [[ ! -s tfplan ]]; then
            echo "::error::The saved plan environments/dev/tfplan is missing or empty."
            exit 1
          fi

      - name: Initialize Terraform
        run: terraform init -input=false

      - name: Apply saved Terraform plan
        env:
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
        run: |
          terraform apply \
            -input=false \
            -auto-approve \
            -lock-timeout=60s \
            tfplan
