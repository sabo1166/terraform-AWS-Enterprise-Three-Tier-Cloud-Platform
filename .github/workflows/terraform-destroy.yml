name: Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      confirm_destroy:
        description: "Type DESTROY to confirm infrastructure deletion"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: terraform-aws-dev
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  AWS_REGION: ${{ vars.AWS_REGION }}

jobs:
  plan-destroy:
    name: Create Destroy Plan
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: TerraformAWS-Enterprise-Three-Tier-Cloud-Platform/environments/dev

    steps:
      - name: Require explicit confirmation
        env:
          CONFIRM_DESTROY: ${{ inputs.confirm_destroy }}
        run: |
          if [[ "$CONFIRM_DESTROY" != "DESTROY" ]]; then
            echo "::error::Confirmation failed. Type DESTROY exactly."
            exit 1
          fi

      - name: Validate AWS configuration
        run: |
          if [[ -z "$AWS_REGION" ]]; then
            echo "::error::Set the AWS_REGION repository variable."
            exit 1
          fi

          if [[ "$AWS_REGION" != "us-east-1" ]]; then
            echo "::error::AWS_REGION must match the backend region configured in backend.tf."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Initialize Terraform
        run: terraform init -input=false

      - name: Create destruction plan
        env:
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
        run: |
          if [[ -z "$TF_VAR_db_password" ]]; then
            echo "::error::Add the TF_VAR_DB_PASSWORD repository secret."
            exit 1
          fi

          terraform plan \
            -destroy \
            -input=false \
            -lock-timeout=60s \
            -out=tfplan

      - name: Upload destruction plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-destroy-plan
          path: TerraformAWS-Enterprise-Three-Tier-Cloud-Platform/environments/dev/tfplan
          retention-days: 1
          if-no-files-found: error

  destroy:
    name: Terraform Destroy
    needs: plan-destroy
    runs-on: ubuntu-latest
    environment: production

    defaults:
      run:
        shell: bash
        working-directory: TerraformAWS-Enterprise-Three-Tier-Cloud-Platform/environments/dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Initialize Terraform
        run: terraform init -input=false

      - name: Download destruction plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-destroy-plan
          path: TerraformAWS-Enterprise-Three-Tier-Cloud-Platform/environments/dev

      - name: Apply destruction plan
        run: |
          terraform apply \
            -input=false \
            -lock-timeout=60s \
            tfplan