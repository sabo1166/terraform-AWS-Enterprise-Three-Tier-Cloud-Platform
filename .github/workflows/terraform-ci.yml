name: Terraform CI

# Static checks only: formatting and offline validation. There are deliberately
# no AWS credentials, no backend access, no plan and no apply in this workflow.
on:
  pull_request:
  push:
    branches:
      - main
      - refactor/modules

permissions:
  contents: read

concurrency:
  group: terraform-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Version used for the local validation of this project (the code itself
  # requires >= 1.10.0, see versions.tf).
  TF_VERSION: "1.16.2"
  TF_IN_AUTOMATION: "true"

jobs:
  validate:
    name: Format and validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Format check
        run: terraform fmt -check -recursive

      # -backend=false: no S3 backend, no state, no AWS access. Providers and
      # modules are downloaded from the public registry / the repository only.
      - name: Init envs/dev (no backend)
        working-directory: envs/dev
        run: terraform init -backend=false -input=false

      - name: Validate envs/dev
        working-directory: envs/dev
        run: terraform validate

      - name: Init bootstrap (no backend)
        working-directory: bootstrap
        run: terraform init -backend=false -input=false

      - name: Validate bootstrap
        working-directory: bootstrap
        run: terraform validate
