name: Terraform environment
description: >
  Configure AWS credentials, install Terraform and initialize envs/dev against
  the S3 backend. Shared by the init, plan and apply jobs so all three use the
  same version, backend settings and provider versions (from the lock file).

inputs:
  aws-access-key-id:
    description: AWS access key ID (pass from a secret).
    required: true
  aws-secret-access-key:
    description: AWS secret access key (pass from a secret).
    required: true
  aws-region:
    description: >
      AWS region; must be the region of the state bucket. Optional: when empty, the
      project's default region from envs/dev/backend.hcl.example is used.
    required: false
    default: ""
  state-bucket:
    description: Name of the S3 bucket that holds the Terraform state.
    required: true
  state-key:
    description: Object key of the state file in the bucket.
    required: true
  terraform-version:
    description: Terraform CLI version to install.
    required: true

runs:
  using: composite
  steps:
    # Single source of truth for the backend settings that are not secret: the
    # tracked envs/dev/backend.hcl.example. The state key passed in must match it
    # (no conflicting duplicate), and the region falls back to its region when the
    # AWS_REGION variable is not set. The same region is exported as TF_VAR_region
    # so the plan always uses the region of the backend. Requires a prior checkout.
    - name: Resolve region and check backend settings
      id: region
      shell: bash
      env:
        INPUT_REGION: ${{ inputs.aws-region }}
        STATE_KEY: ${{ inputs.state-key }}
      run: |
        example="envs/dev/backend.hcl.example"
        default_region=$(sed -n 's/^region[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' "$example" | head -n1)
        default_key=$(sed -n 's/^key[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' "$example" | head -n1)
        if [ -z "$default_region" ] || [ -z "$default_key" ]; then
          echo "::error::Could not read the default region and state key from $example."
          exit 1
        fi
        if [ "$STATE_KEY" != "$default_key" ]; then
          echo "::error::The workflow state key does not match the key in $example. Refusing to continue with conflicting backend settings."
          exit 1
        fi
        region="$INPUT_REGION"
        if [ -z "$region" ]; then
          region="$default_region"
          echo "::notice::The AWS_REGION repository variable is not set; using the project's default region ($region) from $example. Set AWS_REGION if the state bucket is in a different region."
        fi
        echo "value=$region" >> "$GITHUB_OUTPUT"
        echo "TF_VAR_region=$region" >> "$GITHUB_ENV"

    # Credentials are masked in logs by the action and are never echoed.
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        aws-access-key-id: ${{ inputs.aws-access-key-id }}
        aws-secret-access-key: ${{ inputs.aws-secret-access-key }}
        aws-region: ${{ steps.region.outputs.value }}

    # Proves the credentials work before Terraform runs. Output is discarded so the
    # account ID and caller ARN never reach the log.
    - name: Verify AWS authentication
      shell: bash
      run: |
        if ! aws sts get-caller-identity > /dev/null 2>&1; then
          echo "::error::AWS authentication failed: the AWS credentials were rejected or cannot reach AWS. Check the AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY secrets."
          exit 1
        fi
        echo "AWS authentication succeeded."

    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v4
      with:
        terraform_version: ${{ inputs.terraform-version }}
        terraform_wrapper: false

    - name: Terraform init (S3 backend)
      shell: bash
      working-directory: envs/dev
      env:
        STATE_BUCKET: ${{ inputs.state-bucket }}
        STATE_KEY: ${{ inputs.state-key }}
        STATE_REGION: ${{ steps.region.outputs.value }}
      run: |
        if ! terraform init -input=false \
          -backend-config="bucket=${STATE_BUCKET}" \
          -backend-config="key=${STATE_KEY}" \
          -backend-config="region=${STATE_REGION}" \
          -backend-config="encrypt=true" \
          -backend-config="use_lockfile=true"; then
          echo "::error::Terraform backend initialization failed. Check that the state bucket exists, that the TF_STATE_BUCKET value is correct, and that its region matches the AWS region in use."
          exit 1
        fi
